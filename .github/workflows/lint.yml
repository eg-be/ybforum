name: Lint using PHP-CS-Fixer
run-name: ${{ github.actor }} pushed, running PHP-CS-Fixer
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'issue/**'
jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: php-cs-fixer
    - name: Run PHP-CS-Fixer
      run: php-cs-fixer fix --dry-run --diff 
